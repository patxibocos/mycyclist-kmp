name: iOS CI

on: pull_request

jobs:
  build:

    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Generate dummy framework
        run: ./gradlew :composeApp:generateDummyFramework

      - name: Install Pods
        run: ./gradlew podInstall

      - name: Build iOS app
        run: |
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64